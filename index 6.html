<title>TS Mirae</title>

<style>
:root{--bg:#000;--ink:#fff;--mute:#9a9a9a;--line:#3a3a3a;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg)}
body{color:var(--ink);font-family:"Manrope",system-ui,-apple-system,"Segoe UI",sans-serif;min-height:100vh}
main{max-width:460px;margin:0 auto;padding:72px 22px 56px;text-align:center}
.logo{width:min(300px,78%);height:auto;display:block;margin:0 auto 14px}
.tag{margin:0 0 48px;color:var(--mute);font-size:15px;font-weight:500}
ul{list-style:none;margin:0;padding:0;display:grid;gap:14px}
a.link{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:18px 22px;border:1.5px solid var(--line);border-radius:999px;color:var(--ink);text-decoration:none;font-weight:700;font-size:17px;transition:background .15s,color .15s,border-color .15s}
a.link span{font-weight:500;font-size:13px;color:var(--mute);transition:color .15s}
a.link:active{background:var(--ink);color:#000;border-color:var(--ink)}
a.link:active span{color:#444}
a.link:focus-visible{outline:2px solid #fff;outline-offset:3px}
@media (hover:hover){a.link:hover{background:var(--ink);color:#000;border-color:var(--ink)}a.link:hover span{color:#444}}
@media (prefers-reduced-motion:reduce){a.link,a.link span{transition:none}}
</style>
